<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON//FOCUS</title>
  </head>
  <body class="page" data-mode="1">
    <a href="#main-content" class="skip-link">
      Pular para o conteúdo principal
    </a>
    <header>
      <h1 class="logo">
        <img src="/logo.png" alt="">
      </h1>
    </header>
    <main id="main-content">
      <section aria-label="Banner" class="banner">
        <h2 class="banner__title"><span class="banner__title--text">Otimize sua produtividade,</span><br><strong class="banner__title--highlight">mergulhe no que importa</strong></h2>
        <img src="/mode-1-cyberpunk.png" alt="Operadora cyberpunk concentrada diante de um painel holográfico">
      </section>
      <section aria-label="Timer" class="timer-card">
        <div role="tablist" aria-label="Tipo de timer" class="timer-card__tabs">
          <button data-mode="1" class="timer-card__tab timer-card__tab--active" role="tab" type="button" aria-selected="true">
            Foco // MODO ATAQUE
          </button>
          <button data-mode="2" class="timer-card__tab" role="tab" type="button" aria-selected="false">
            Descanso curto // RECARGA
          </button>
          <button data-mode="3" class="timer-card__tab" role="tab" type="button" aria-selected="false">
            Descanso longo // REBOOT
          </button>
        </div>
        <div class="timer-card__display">
          <span class="timer-card__time" role="timer" aria-live="polite" aria-label="Tempo restante">
            25:00
          </span>
        </div>
        <label for="toggle-music" class="music-toggle">
          <input type="checkbox" id="toggle-music" class="music-toggle__input"> Trilha neural
        </label>
        <form class="timer-card__form">
          <button class="button">
            <span class="icon icon--play" area-hidden="true"></span>
            Iniciar protocolo
          </button>
        </form>
      </section>
      <section aria-labelledby="task-board-heading" class="task-board">
        <p class="current-task" aria-live="polite">
          <span class="current-task__label">#TRANSMISSÃO ATIVA:</span>
          <strong class="current-task__name">Nenhuma missão conectada</strong>
        </p>
  
        <div class="task-board__header">
          <h2 id="task-board-heading" class="task-board__heading">Fila de missões</h2>
          <details class="task-menu">
            <summary class="task-menu__trigger" aria-label="Opções da lista de tarefas">
              <span class="icon icon--more icon--lg" aria-hidden="true"></span>
            </summary>
            <ul class="task-menu__list" role="menu">
              <li class="task-menu__item" role="none">
                <button type="button" class="task-menu__button" id="btn-clear-completed" data-action="clear-completed" role="menuitem">
                  <span class="icon icon--check icon--md" aria-hidden="true"></span>
                  Purgar missões concluídas
                </button>
              </li>
              <li class="task-menu__item" role="none">
                <button type="button" class="task-menu__button" id="btn-clear-all" data-action="clear-all" role="menuitem">
                  <span class="icon icon--delete icon--md" aria-hidden="true"></span>
                  Purgar todas as missões
                </button>
              </li>
            </ul>
          </details>
        </div>
  
        <ul class="task-list">
        </ul>
  
        <form class="task-form" data-action="save-todo" hidden>
          <label class="task-form__label" for="task-input">Nova missão</label>
          <textarea class="task-form__textarea" id="task-input" name="task" required
            placeholder="Qual é o próximo protocolo?"></textarea>
          <div class="task-form__footer">
            <button type="button" class="task-form__button" id="btn-delete" data-action="delete-todo">
              <span class="icon icon--delete icon--sm" aria-hidden="true"></span>
              Deletar
            </button>
            <span class="task-form__spacer"></span>
            <button type="button" class="task-form__button" id="btn-cancel" data-action="cancel-todo">
              <span class="icon icon--close icon--sm" aria-hidden="true"></span>
              Abortar
            </button>
            <button type="submit" class="task-form__button task-form__button--confirm">
              <span class="icon icon--save icon--sm" aria-hidden="true"></span>
              Confirmar
            </button>
          </div>
        </form>
  
        <button type="button" class="add-task-button" data-action="toggle-form">
          <span class="icon icon--add add-task-button__icon" aria-hidden="true"></span>
          Adicionar missão
        </button>
      </section>
    </main>
    <footer class="site-footer">
      <p class="site-footer__text">NEON//FOCUS — mantenha o sinal. Desconecte o ruído. Avance.</p>
    </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
